name: Daily report to LINE WORKS

on:
  # Started once daily at 19:00 JST by Cloudflare.
  workflow_dispatch:
    inputs:
      recipient_scope:
        description: "送信先"
        required: true
        default: owner
        type: choice
        options:
          - late_and_owner
          - owner
          - others
          - all

permissions:
  contents: write
  id-token: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check today's snapshot
        id: daily
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const day = new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Tokyo' });
          const history = JSON.parse(readFileSync('data/history.json', 'utf8'));
          appendFileSync(process.env.GITHUB_OUTPUT, `collected=${Boolean(history[day]?.sentAt)}\n`);
          NODE
      - name: Collect daily counters
        if: steps.daily.outputs.collected != 'true'
        env:
          DRY_RUN: "1"
          MEMBERS_ENDPOINT: ${{ secrets.MEMBERS_ENDPOINT }}
          MEMBERS_TOKEN: ${{ secrets.MEMBERS_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          TIKTOK_USERNAME: ${{ vars.TIKTOK_USERNAME }}
        run: node src/index.mjs
      - name: Persist latest counters
        if: steps.daily.outputs.collected != 'true'
        run: |
          git config user.name "daily-report-bot"
          git config user.email "daily-report-bot@users.noreply.github.com"
          git add -f data/latest.json data/history.json data/instagram-insights.csv data/instagram-insights.md docs/index.html
          git diff --cached --quiet || git commit -m "chore: update daily report counters"
          git push
      - name: Publish snapshot and send the same attendance report
        env:
          LINEWORKS_CLIENT_ID: ${{ secrets.LINEWORKS_CLIENT_ID }}
          LINEWORKS_CLIENT_SECRET: ${{ secrets.LINEWORKS_CLIENT_SECRET }}
          LINEWORKS_SERVICE_ACCOUNT: ${{ secrets.LINEWORKS_SERVICE_ACCOUNT }}
          LINEWORKS_PRIVATE_KEY: ${{ secrets.LINEWORKS_PRIVATE_KEY }}
          LINEWORKS_BOT_ID: ${{ secrets.LINEWORKS_BOT_ID }}
          LINEWORKS_USER_ID: ${{ secrets.LINEWORKS_USER_ID }}
          LINEWORKS_RECIPIENT_SCOPE: ${{ inputs.recipient_scope }}
          ALREADY_COLLECTED: ${{ steps.daily.outputs.collected }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, existsSync } from 'node:fs';
          import { sendLineWorks } from './src/lineworks.mjs';
          const endpoint = 'https://shift-note-sekiya-260917.fiteasy-miyazakioohashi.workers.dev/api/sns-reports/ingest';
          const day = new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Tokyo' });
          const yesterday = new Date(day + 'T00:00:00Z');
          yesterday.setUTCDate(yesterday.getUTCDate() - 1);
          const previousDay = yesterday.toISOString().slice(0, 10);
          const history = JSON.parse(readFileSync('data/history.json', 'utf8'));
          if (!history[day]?.collectedAt) throw new Error('Today has no collected snapshot');
          const tokenUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          tokenUrl.searchParams.set('audience', endpoint);
          const proof = await fetch(tokenUrl, {
            headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
            signal: AbortSignal.timeout(15000)
          });
          if (!proof.ok) throw new Error(`Workflow identity unavailable: ${proof.status}`);
          const { value } = await proof.json();
          const payload = Object.fromEntries([previousDay, day].filter(d => history[d]).map(d => [d, history[d]]));
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-sns-workflow-token': value },
            body: JSON.stringify(payload),
            signal: AbortSignal.timeout(15000)
          });
          if (!response.ok) throw new Error(`Attendance snapshot failed: ${response.status}`);
          const result = await response.json();
          if (!result.ok) throw new Error('Attendance snapshot was not accepted');
          console.log(result.alreadySaved ? 'Daily snapshot already saved; no overwrite.' : 'Daily snapshot saved.');
          let recipients;
          if (process.env.LINEWORKS_RECIPIENT_SCOPE === 'late_and_owner') {
            if (result.delivery?.date !== day || result.delivery?.scope !== 'late_and_owner' || !result.delivery?.recipients?.length) throw new Error('Late shift recipients unavailable');
            recipients = result.delivery.recipients;
            const ownerUserId = result.delivery.ownerUserId;
            if (typeof ownerUserId !== 'string' || !ownerUserId.trim() || !recipients.some(r => r.userId === ownerUserId)) throw new Error('Verified owner recipient unavailable');
            process.env.LINEWORKS_USER_ID = ownerUserId;
            console.log('Daily recipients (late shift + owner): ' + recipients.map(r => r.name).join('・'));
          }
          // Collection and delivery are separate. The collector's legacy sentAt
          // field is not proof that LINE WORKS accepted a message.
          const ledgerPath = 'data/delivery-status.json';
          const ledger = existsSync(ledgerPath) ? JSON.parse(readFileSync(ledgerPath, 'utf8')) : {};
          const deliveryKey = day + ':' + process.env.LINEWORKS_RECIPIENT_SCOPE;
          if (ledger[deliveryKey]?.status === 'sent') {
            console.log('Daily delivery already accepted; no duplicate notification.');
          } else {
            if (ledger[deliveryKey]) throw new Error('Previous delivery is unconfirmed; inspect before retrying to avoid duplicates');
            if (result.report?.status !== 'ready' || result.report.date !== day || !result.report.text) throw new Error('Combined attendance report unavailable');
            if (process.env.LINEWORKS_RECIPIENT_SCOPE === 'owner' && !process.env.LINEWORKS_USER_ID) throw new Error('Owner recipient is not configured');
            const entry = {status: 'sending', attemptedAt: new Date().toISOString()};
            ledger[deliveryKey] = entry;
            const save = () => writeFileSync(ledgerPath, JSON.stringify(ledger, null, 2) + '\n');
            save();
            try {
              await sendLineWorks(process.env, result.report.text, fetch, recipients);
              entry.status = 'sent';
              entry.sentAt = new Date().toISOString();
            } catch (error) {
              entry.status = 'unconfirmed';
              throw error;
            } finally { save(); }
          }
          NODE
      - name: Persist delivery receipt even if sending fails
        if: always()
        run: |
          if [ -f data/delivery-status.json ]; then
            git config user.name "daily-report-bot"
            git config user.email "daily-report-bot@users.noreply.github.com"
            git add -f data/delivery-status.json
            git diff --cached --quiet || git commit -m "chore: record LINE WORKS delivery outcome"
            git push
          fi
