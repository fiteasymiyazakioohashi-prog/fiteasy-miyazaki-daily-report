name: Daily report to LINE WORKS

on:
  schedule:
    # 19:00 Asia/Tokyo = 10:00 UTC
    - cron: "0 10 * * *"
    # 19:20の予備実行。送信済みならプログラム側で終了する
    - cron: "20 10 * * *"
  workflow_dispatch:
    inputs:
      recipient_scope:
        description: "送信先"
        required: true
        default: owner
        type: choice
        options:
          - owner
          - others
          - all

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect and send report
        env:
          MEMBERS_ENDPOINT: ${{ secrets.MEMBERS_ENDPOINT }}
          MEMBERS_TOKEN: ${{ secrets.MEMBERS_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          TIKTOK_USERNAME: ${{ vars.TIKTOK_USERNAME }}
          LINEWORKS_CLIENT_ID: ${{ secrets.LINEWORKS_CLIENT_ID }}
          LINEWORKS_CLIENT_SECRET: ${{ secrets.LINEWORKS_CLIENT_SECRET }}
          LINEWORKS_SERVICE_ACCOUNT: ${{ secrets.LINEWORKS_SERVICE_ACCOUNT }}
          LINEWORKS_PRIVATE_KEY: ${{ secrets.LINEWORKS_PRIVATE_KEY }}
          LINEWORKS_BOT_ID: ${{ secrets.LINEWORKS_BOT_ID }}
          LINEWORKS_USER_ID: ${{ secrets.LINEWORKS_USER_ID }}
          LINEWORKS_RECIPIENT_SCOPE: ${{ inputs.recipient_scope }}
        run: node src/index.mjs
      - name: Persist latest counters
        run: |
          git config user.name "daily-report-bot"
          git config user.email "daily-report-bot@users.noreply.github.com"
          git add -f data/latest.json data/history.json data/instagram-insights.csv data/instagram-insights.md docs/index.html
          git diff --cached --quiet || git commit -m "chore: update daily report counters"
          git push
